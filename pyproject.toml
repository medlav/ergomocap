[project]
name = "ErgoMoCap"
version = "0.0.1"
description = "Modular Backend Engine for Ergonomic Risk Assessment from MoCap data"
authors = [{ name = "medlav", email = "your.email@example.com" }]
license = { text = "AGPL-3.0" }
requires-python = ">=3.12.10"
dependencies = [
    "freemocap>=1.8.2", # will include most of the other dependecies..
    "docxtpl>=0.20.2",
]

[project.optional-dependencies]

# Development, Linting, and Security Tools
dev = [
    "pre-commit==4.5.1",
    "bandit==1.9.4",
    "ruff==0.15.15",
    "pydoclint==0.8.4",
    "interrogate==1.7.0",
    "auto-py-to-exe",
    "pip-licenses==5.5.5",
]

# Testing and Coverage
test = [
    "pytest-cov==7.1.0",
    "pytest-qt==4.5.0",
    "anybadge==1.16.0",
    "coverage-badge==1.1.2",
]

# Documentation Generation
docs = [
    "mkdocs==1.6.1",
    "mkdocs-autorefs==1.4.4",
    "mkdocs-get-deps==0.2.2",
    "mkdocs-material==9.7.6",
    "mkdocs-material-extensions==1.3.1",
    "mkdocstrings==1.0.3",
    "mkdocstrings-python==2.0.3",
]


[tool.pytest.ini_options]
# Default CLI flags: verbose, show locals on failure, and set the test directory
addopts = "-v --showlocals"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]

# TODO remove this or specify only for matplotlib
filterwarnings = "ignore::DeprecationWarning"


[tool.coverage.run]
# Which folders to measure for code coverage
source = ["calculators", "gui"]
omit = [
    "tests/*",
    "**/__init__.py",
    ".venv/*",        # Ignores your local virtual environment
    "venv/*",         # Common alternative venv name
    "site/*",         # Ignores MkDocs build output or site-packages
    "dist/*",         # Ignores build distributions
    "build/*",        # Ignores build artifacts
]
relative_files = true
concurrency = ["thread"] # Added for MoCap processing threads


[tool.coverage.report]
# Fail the build if total coverage is under 80%
fail_under = 80 # TODO should be 100% or closer!!
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
    "abc.abstractmethod",
]
include = ["gui/*", "calculators/*"]

[tool.black]
# If you use Black for formatting, 3.12 likes 88 chars
line-length = 88
target-version = ['py312']


[tool.bandit]
# Explicitly exclude the folders AND their contents
exclude_dirs = [
    "tests",     # Standard top-level unit and integration tests
    "*/tests/*", # Recursive pattern to ignore nested test suites in sub-packages
    "venv",      # Local virtual environment (avoids scanning third-party libs)
    ".venv",     # Alternative hidden virtual environment directory
    "docs",      # MkDocs/Sphinx documentation source files
    "build",     # Temporary artifacts generated during the build process
    "dist",      # Compiled binaries and source distributions for release
    "site",      # Static website files generated by the documentation tool
    "bin",       # Local scripts, hooks, or environment-specific executables
    "intl",      # Internal dev-only tools for internationalization/translation
]

# GLOBAL SKIPS: This is your insurance policy.
# B101: assert_used (Mandatory skip for Pytest users)
# B601: paramiko_calls (Only if you aren't using SSH)
skips = ["B101"]

# TARGETED TESTS: Focus on the syscalls/file injection threats
# tests = ["B602", "B603", "B607", "B301", "B403", "B113", "B108"]

[tool.bandit.any_other_function_with_shell_equals_true]
no_shell = [
    "os.execl",
    "os.execle",
    "os.execlp",
    "os.execlpe",
    "os.execv",
    "os.execve",
    "os.execvp",
    "os.execvpe",
    "os.spawnl",
    "os.spawnle",
    "os.spawnlp",
    "os.spawnlpe",
    "os.spawnv",
    "os.spawnve",
    "os.spawnvp",
    "os.spawnvpe",
    "os.startfile",
]
shell = [
    "os.system",
    "os.popen",
    "os.popen2",
    "os.popen3",
    "os.popen4",
    "commands.getoutput",
    "commands.getstatusoutput",
]
subprocess = [
    "subprocess.Popen",
    "subprocess.call",
    "subprocess.check_call",
    "subprocess.check_output",
]

[tool.bandit.hardcoded_tmp_directory]
# Ensure you aren't creating race conditions in /tmp
tmp_dirs = ["/tmp", "/var/tmp", "/usr/tmp"]


[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = true
fail-under = 80
exclude = ["setup.py", "tests", "docs", "venv", ".venv"]
ignore-regex = ["^get$", "^mock_.*", ".*BaseClass.*"]
verbose = 0
quiet = false
color = true
generate-badge = "assets"
badge-format = "svg"


[tool.todo_scanner]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    ".ruff_cache",
    ".github",
    "site",
    ".pytest_cache",
    "docs",
    "dist",
    "build",
]
include_extensions = [".py", ".toml", ".yml", ".sh", ".md"]
output_file = "TODO.md"


[tool.pylint.main]
init-hook = "import sys; sys.setrecursionlimit(2000)"

[tool.pylint.pyreverse]
# Basic Project Info
project = "."
output-directory = "docs/architecture"

# Filtering (Don't map the noise)
ignore = ["tests", "assets", "docs", "intl", "scripts"]

# Visuals (Make it readable)
colorized = true
module-names = "yes"
output = "png"


[tool.pip-licenses]

format = "markdown"
output-file = "CREDITS.md"


[tool.pydoclint]
style = 'google'
# This regex ignores your build, envs, tests, data, and dev folders
exclude = '(\.venv|venv|ENV|env|dist|build|htmlcov|\.tox|\.pytest_cache|\.ruff_cache|tests|scripts|ergomocap_data|freemocap_data|output|runs|release|site|\.github|\.vscode)/|__pycache__|\.py[cod]'
